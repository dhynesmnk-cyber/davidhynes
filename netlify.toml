[build]
  command = "npm run build"
  publish = "dist"

# Plain-text "skip the garden" view (FR-7). Existing files are served
# before redirects, so /static.html works directly; this covers /static.
[[redirects]]
  from = "/static"
  to = "/static.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
