<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="David Hynes — AI Enablement &amp; Responsible AI" />
    <meta property="og:description" content="An explorable stop-motion garden. Walk the bee to each set piece to read the work — or skip the garden for the plain-text version." />

    <meta name="twitter:title" content="David Hynes — AI Enablement &amp; Responsible AI" />
    <meta name="twitter:description" content="An explorable stop-motion garden. Walk the bee to each set piece to read the work." />
    <meta name="twitter:image" content="%SITE_URL%/assets/og-image.png" />

    <link rel="preload" href="/assets/fonts/Caveat-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/Nunito-variable.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      @font-face {
        font-family: 'Caveat';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/assets/fonts/Caveat-700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 200 1000;
        font-display: swap;
        src: url('/assets/fonts/Nunito-variable.woff2') format('woff2');
      }

      :root {
        --dusk: #241A38;
        --dusk-mid: #3A2B55;
        --felt: #C97B3D;
        --felt-dark: #6E4A2E;
        --pink: #FF6FB0;
        --cyan: #5FE3DD;
        --violet: #A78BFA;
        --violet-deep: #6B4FCF;
        --paper: #F3E9D6;
        --ink: #241A38;
        --hand: 'Caveat', 'Chalkboard SE', 'Comic Sans MS', cursive;
        --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--dusk);
        color: var(--paper);
        font-family: var(--body);
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #garden-main, #game-container { width: 100%; height: 100%; display: block; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      canvas { display: block; margin: 0 auto; }

      /* ---- Skip link (a11y) ------------------------------------------ */
      .skip-link {
        position: absolute;
        top: -60px;
        left: 12px;
        background: var(--paper);
        color: var(--ink);
        padding: 10px 16px;
        border-radius: 6px;
        z-index: 10001;
        text-decoration: none;
        font-weight: 700;
        transition: top 0.15s ease;
      }
      .skip-link:focus { top: 12px; outline: 3px solid var(--cyan); }

      /* ---- Persistent controls --------------------------------------- */
      #garden-controls {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        z-index: 9000;
        display: flex;
        gap: 8px;
      }
      #mute-toggle {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 2px solid var(--felt-dark);
        background: rgba(243, 233, 214, 0.92);
        color: var(--ink);
        cursor: pointer;
        display: grid;
        place-items: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
        transform: rotate(-3deg);
      }
      #mute-toggle:hover { background: var(--paper); }
      #mute-toggle:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
      #mute-toggle[aria-pressed="true"] { opacity: 0.7; }

      #skip-garden {
        position: fixed;
        bottom: max(10px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        z-index: 9000;
        color: var(--paper);
        background: rgba(36, 26, 56, 0.82);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 3px;
        padding: 6px 14px;
        white-space: nowrap;
      }
      #skip-garden:hover, #skip-garden:focus-visible { background: var(--dusk); outline: 2px solid var(--cyan); }

      /* ---- Onboarding hint (FR-5) ------------------------------------ */
      #onboarding-hint {
        position: fixed;
        left: 50%;
        top: calc(50% + 64px);
        transform: translate(-50%, 8px) rotate(-2deg);
        background: var(--paper);
        color: var(--ink);
        font-family: var(--hand);
        font-size: 22px;
        line-height: 1.1;
        text-align: center;
        padding: 10px 18px 12px;
        border-radius: 3px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
        clip-path: polygon(0 4%, 3% 0, 97% 2%, 100% 8%, 99% 94%, 96% 100%, 4% 98%, 0 92%);
        opacity: 0;
        transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        pointer-events: none;
        z-index: 9000;
        max-width: 80vw;
      }
      #onboarding-hint small { display: block; font-family: var(--body); font-size: 12px; font-weight: 700; opacity: 0.7; margin-top: 4px; letter-spacing: 0.02em; }
      #onboarding-hint.is-visible { opacity: 1; transform: translate(-50%, 0) rotate(-2deg); }
      #onboarding-hint.is-fading { opacity: 0; transform: translate(-50%, -14px) rotate(-1deg); }

      /* ---- Modal (FR-3) ---------------------------------------------- */
      #modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(36, 26, 56, 0.72);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        z-index: 9999;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      #modal-overlay.is-open { opacity: 1; }

      #zone-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.96) rotate(0.4deg);
        width: min(92vw, 680px);
        max-height: 86vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        background: var(--paper);
        color: var(--ink);
        border-radius: 6px;
        box-shadow: 0 24px 60px rgba(20, 10, 40, 0.55), 0 0 0 1px rgba(110, 74, 46, 0.25);
        z-index: 10000;
        opacity: 0;
        transition: opacity 0.3s cubic-bezier(0.33, 1, 0.68, 1), transform 0.3s cubic-bezier(0.33, 1, 0.68, 1);
        clip-path: polygon(0% 1%, 2% 0%, 4% 1%, 6% 0%, 8% 1%, 10% 0%, 12% 1%, 14% 0%, 16% 1%, 18% 0%, 20% 1%, 22% 0%, 24% 1%, 26% 0%, 28% 1%, 30% 0%, 32% 1%, 34% 0%, 36% 1%, 38% 0%, 40% 1%, 42% 0%, 44% 1%, 46% 0%, 48% 1%, 50% 0%, 52% 1%, 54% 0%, 56% 1%, 58% 0%, 60% 1%, 62% 0%, 64% 1%, 66% 0%, 68% 1%, 70% 0%, 72% 1%, 74% 0%, 76% 1%, 78% 0%, 80% 1%, 82% 0%, 84% 1%, 86% 0%, 88% 1%, 90% 0%, 92% 1%, 94% 0%, 96% 1%, 98% 0%, 100% 1%, 100% 99%, 98% 100%, 96% 99%, 94% 100%, 92% 99%, 90% 100%, 88% 99%, 86% 100%, 84% 99%, 82% 100%, 80% 99%, 78% 100%, 76% 99%, 74% 100%, 72% 99%, 70% 100%, 68% 99%, 66% 100%, 64% 99%, 62% 100%, 60% 99%, 58% 100%, 56% 99%, 54% 100%, 52% 99%, 50% 100%, 48% 99%, 46% 100%, 44% 99%, 42% 100%, 40% 99%, 38% 100%, 36% 99%, 34% 100%, 32% 99%, 30% 100%, 28% 99%, 26% 100%, 24% 99%, 22% 100%, 20% 99%, 18% 100%, 16% 99%, 14% 100%, 12% 99%, 10% 100%, 8% 99%, 6% 100%, 4% 99%, 2% 100%, 0% 99%);
        font-size: 15px;
        line-height: 1.6;
      }
      #zone-modal.is-open { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      .modal-content { padding: 28px 36px 26px; }
      @media (max-width: 480px) { .modal-content { padding: 22px 20px 20px; } }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        border-bottom: 3px solid var(--violet);
        padding-bottom: 12px;
        margin-bottom: 18px;
      }
      .modal-header h2 {
        font-family: var(--hand);
        font-size: 36px;
        line-height: 1;
        font-weight: 700;
        color: var(--ink);
      }
      .modal-x {
        flex: none;
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--felt-dark);
        font-size: 30px;
        line-height: 1;
        cursor: pointer;
      }
      .modal-x:hover { background: rgba(110, 74, 46, 0.12); }
      .modal-x:focus-visible, .modal-close:focus-visible, #zone-modal a:focus-visible {
        outline: 3px solid var(--violet-deep);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .modal-intro {
        font-family: var(--hand);
        font-size: 24px;
        line-height: 1.2;
        color: var(--felt-dark);
        border-left: 4px solid var(--pink);
        padding-left: 14px;
        margin-bottom: 22px;
      }
      .modal-sign { font-family: var(--hand); font-size: 24px; text-align: right; color: var(--felt-dark); margin: -10px 0 18px; }

      .modal-pro h3 {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink);
        margin: 20px 0 8px;
      }
      .modal-pro h3:first-child { margin-top: 0; }
      .modal-pro p { margin: 0 0 12px; }
      .modal-pro ul { margin: 0 0 12px; padding-left: 20px; }
      .modal-pro li { margin: 6px 0; }
      #zone-modal a { color: var(--violet-deep); font-weight: 700; text-decoration: none; }
      #zone-modal a:hover { text-decoration: underline; }

      .modal-footer { border-top: 2px solid var(--violet); padding-top: 16px; margin-top: 24px; }
      .contact-block { font-style: normal; font-size: 14px; color: var(--felt-dark); line-height: 1.7; }
      .contact-block a { color: var(--violet-deep); }
      .modal-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
      .modal-close {
        background: var(--violet-deep);
        color: var(--paper);
        border: none;
        padding: 10px 24px;
        border-radius: 6px;
        font-family: var(--body);
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
      .modal-close:hover { background: #5a3fb8; }
      .modal-skip { font-size: 14px; }
      .modal-links { margin: 4px 0 12px; }

      @media (prefers-reduced-motion: reduce) {
        #zone-modal, #modal-overlay, #onboarding-hint, .skip-link { transition: none; }
      }

      noscript .nojs { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
      noscript .nojs a { color: var(--cyan); }
    </style>
  </head>
  <body>
    <header id="garden-header">
      <a href="/static.html" class="skip-link">Skip the garden → plain-text version</a>
      <h1 class="sr-only">David Hynes — AI Enablement &amp; Responsible AI</h1>
    </header>
    <main id="garden-main">
      <div id="game-container" role="application" aria-label="Interactive garden. Use the arrow keys to walk the bee to a set piece and press E to read. A plain-text version is linked in the footer."></div>
    </main>
    <footer id="garden-footer"></footer>
    <noscript>
      <div class="nojs">
        <p>The garden needs JavaScript. <a href="/static.html">Read the plain-text version instead →</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
