<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="David Hynes — AI Enablement & Responsible AI Lead. An explorable stop-motion diorama world." />
    <meta name="theme-color" content="#241A38" />
    <title>David Hynes — AI Enablement</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta property="og:title" content="David Hynes — AI Enablement & Responsible AI" />
    <meta property="og:description" content="An explorable stop-motion diorama world with glowwave lighting." />
    <meta property="og:image" content="/assets/og-image.png" />
    <meta property="og:type" content="website" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { 
        width: 100%; 
        height: 100%; 
        overflow: hidden; 
        background: #241A38;
        touch-action: none;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: block;
      }
      canvas {
        display: block;
        margin: 0 auto;
      }
      /* Skip link for accessibility */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #F3E9D6;
        color: #241A38;
        padding: 8px 16px;
        z-index: 10000;
        text-decoration: none;
        font-family: system-ui, sans-serif;
      }
      .skip-link:focus { top: 0; }
    </style>
  </head>
  <body>
    <a href="#static-view" class="skip-link">Skip the garden →</a>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
